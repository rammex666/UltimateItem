fullsets:
  fire_set:
    Name: '&6Fire Set'
    Set_Items:
      - 'headOfFire'
    Full_Set_Bonus:
      - 'NIGHT_VISION:1'

pickaxe_multi_block:
  diamond_pickaxe:
    Material: DIAMOND_PICKAXE
    Name: '&6Diamond MultiBlock Pickaxe'
    Lore:
      - '&7Mines in a configurable area'
    Dropable: true
    KeepOnDeath: true
    Indestructible: false
    Durability: 100
    MiningArea: [6, 6, 6] # Dimensions dynamiques (x, y, z)


auto_place_block:
  obsidian_placer:
    Material: OBSIDIAN
    Name: '&6Obsidian Placer'
    Lore:
      - '&7Right click to place obsidian'
    Dropable: true
    KeepOnDeath: true
    Indestructible: true # if true, the item will not break so useless to put durability
    Durability: 0
    from: 0 # y start
    to: 256 # y end
    getBlockFromInventory: false
    blockTypeFromInventory: OBSIDIAN # if getBlockFromInventory is true, this will be the block type to place

sellsticks:
  x1:
    Material: STICK
    Name: '&6Sell Stick'
    Lore:
      - '&7Right click to sell items'
    SellMultiplier: 1.0
    Dropable: true
    KeepOnDeath: true
    Indestructible: true # if true, the item will not break so useless to put durability
    Durability: 0

items:
  swordOfFire:
    Material: DIAMOND_SWORD
    Name: '&6Fire Sword'
    Lore:
      - '&7This is a legendary Sword'
    Amount: 1
    CustomEffect: "Bolt"
    Dropable: true
    KeepOnDeath: true
    DropPlayerHead: true
    Indestructible: true
    Enchantments_On_Equip:
      - 'SPEED:1'
    Enchantments_Associated:
      - 'DAMAGE_ALL:1'
      - 'DURABILITY:3'
  headOfFire:
    Material: DIAMOND_HELMET
    Name: '&6Fire Helmet'
    Lore:
      - '&7This is a legendary helmet'
    Amount: 1
    CustomEffect: "Stealth"
    Dropable: true
    KeepOnDeath: true
    DropPlayerHead: true
    Indestructible: true
    Enchantments_On_Equip:
      - 'SPEED:1'
    Enchantments_Associated:
      - 'DAMAGE_ALL:1'
      - 'DURABILITY:3'
    Commands_On_Event:
      type:
        - 'onUse' #onHit, ect...
        - 'onHit'
      CommandsOnYou:
        - 'heal:50'
      CommandsOnEnemy:
        - 'say t''est pas bo:100'
