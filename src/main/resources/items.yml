pickaxe_multi_block:
  diamond_pickaxe:
    Material: DIAMOND_PICKAXE
    Name: '&6Diamond MultiBlock Pickaxe'
    Lore:
      - '&7Mines in a configurable area'
    Dropable: true
    KeepOnDeath: true
    Indestructible: false
    Durability: 100
    MiningArea: [3, 3, 3] # Dimensions dynamiques (x, y, z)


auto_place_block:
  obsidian_placer:
    Material: OBSIDIAN
    Name: '&6Obsidian Placer'
    Lore:
      - '&7Right click to place obsidian'
    Dropable: true
    KeepOnDeath: true
    Indestructible: true # if true, the item will not break so useless to put durability
    Durability: 0
    from: 0 # y start
    to: 256 # y end
    getBlockFromInventory: false
    blockTypeFromInventory: OBSIDIAN # if getBlockFromInventory is true, this will be the block type to place

sellsticks:
  x1:
    Material: STICK
    Name: '&6Sell Stick'
    Lore:
      - '&7Right click to sell items'
    SellMultiplier: 1.0
    Dropable: true
    KeepOnDeath: true
    Indestructible: true # if true, the item will not break so useless to put durability
    Durability: 0

items:
  headOfFire:
    Material: DIAMOND_HELMET
    Name: '&6Fire Helmet'
    fullSet: 'FireSet'
    Lore:
      - '&7This is a legendary helmet'
    Amont: 1
    Dropable: true
    KeepOnDeath: true
    DropPlayerHead: true
    Indestructible: true
    Enchantments_On_Equip:
      - 'DAMAGE_ALL:1'
      - 'DURABILITY:3'
    Full_Set_Bonus:
      - 'DAMAGE_ALL:1'
      - 'DURABILITY:3'
    Enchantments_Associated:
      - 'DAMAGE_ALL:1'
      - 'DURABILITY:3'
    Commands_On_Equip:
      - 'say Hello'
      - 'give %player% diamond 1'
